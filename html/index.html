<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Meshtastic Battery Monitor</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
	<script>
		Chart.register(window['chartjs-plugin-zoom'] || chartjsPluginZoom, window['chartjs-plugin-annotation']);
	</script>
	<style>
		body {
			font-family: Arial;
			margin: 20px;
			background: #f4f4f4
		}

		#cards {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 12px
		}

		.card {
			background: #fff;
			padding: 15px;
			border-radius: 8px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, .15)
		}

		canvas {
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, .15);
			margin-top: 20px;
			height: 320px !important
		}

		table {
			width: 100%;
			background: #fff;
			border-collapse: collapse;
			margin-top: 20px
		}

		th,
		td {
			padding: 8px;
			border-bottom: 1px solid #ddd;
			text-align: left
		}
		
		#chartContainer {	
			position: relative;		
			width: 100%;		
			height: 380px;		
			background: white;		
			border-radius: 8px;		
			box-shadow: 0 2px 5px rgba(0,0,0,.15);		
			padding: 10px;		
			box-sizing: border-box;		
			margin-top: 20px;
		}
	</style>
</head>

<body>
	<h1>Meshtastic Battery Monitor</h1>
	<div id="cards">
		<div class="card"><b>Batería</b>
			<div id="batteryValue">-- %</div>
		</div>
		<div class="card"><b>Voltaje</b>
			<div id="voltageValue">-- V</div>
		</div>
		<div class="card"><b>Uptime</b>
			<div id="uptimeValue">--</div>
		</div>
		<div class="card"><b>Última lectura</b>
			<div id="timeValue">--</div>
		</div>
	</div>
	
	<div id="chartContainer">
			<canvas id="voltageChart"></canvas>
	</div>
	
	<h2>Histórico de reinicios</h2>
	<table>
		<thead>
			<tr>
				<th>Fecha</th>
				<th>Voltaje</th>
				<th>Batería</th>
				<th>Uptime anterior</th>
			</tr>
		</thead>
		<tbody id="resetBody"></tbody>
	</table>
	<script>
	let chart;
	
	async function loadCSV() {
		const txt = await (await fetch("battery.csv?" + Date.now())).text();
		const lines = txt.trim().split("\n");
		lines.shift();
	
		const data = [];
		const ann = {};
		const resets = [];
	
		let prev = null;
		let last = {};
	
		for (const l of lines) {
			if (!l.trim()) continue;
	
			const c = l.split(",");
			const d = new Date(c[0]);
			const b = Math.min(Number(c[1]), 100);
			const v = Number(c[2]);
			const u = Number(c[3]);
	
			data.push({
				x: d,
				y: v
			});
	
			last = { b, v, u, d };
	
			if (prev !== null && u < prev) {
				ann["r" + resets.length] = {
					type: "line",
					xMin: d,
					xMax: d,
					borderColor: "red",
					borderWidth: 2,
					borderDash: [6, 4]
				};
	
				resets.push({
					d,
					b,
					v,
					p: prev / 3600
				});
			}
	
			prev = u;
		}
	
		if (!last.d) return;
	
		batteryValue.textContent = last.b.toFixed(0) + " %";
		voltageValue.textContent = last.v.toFixed(2) + " V";
		uptimeValue.textContent = (last.u / 3600).toFixed(1) + " h";
		timeValue.textContent = last.d.toLocaleString();
	
		resetBody.innerHTML = "";
	
		resets.reverse().forEach(r => {
			resetBody.insertAdjacentHTML("beforeend",
				`<tr>
					<td>${r.d.toLocaleString()}</td>
					<td>${r.v.toFixed(2)} V</td>
					<td>${r.b.toFixed(0)} %</td>
					<td>${r.p.toFixed(1)} h</td>
				</tr>`);
		});
	
		if (chart) {
			chart.data.datasets[0].data = data;
			chart.options.plugins.annotation.annotations = ann;
			chart.update();
			return;
		}
	
		chart = new Chart(document.getElementById("voltageChart"), {
			type: "line",
			data: {
				datasets: [{
					label: "Voltaje",
					data: data,
					borderWidth: 2,
					tension: 0.25,
					pointRadius: 3,
					pointHoverRadius: 6,
					hitRadius: 15
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				interaction: {
					mode: "nearest",
					intersect: false
				},
				plugins: {
					tooltip: {
						enabled: true,
						mode: "nearest",
						intersect: false,
						callbacks: {
							label: function(context) {
								return context.parsed.y.toFixed(2) + " V";
							}
						}
					},
					legend: {
						display: false
					},
					annotation: {
						annotations: ann
					},
					zoom: {
						pan: {
							enabled: true,
							mode: "x"
						},
						zoom: {
							wheel: {
								enabled: true
							},
							pinch: {
								enabled: true
							},
							mode: "x"
						}
					}
				},
				scales: {
					x: {
						type: "time"
					},
					y: {
						min: 3.5,
						max: 4.2,
						title: {
							display: true,
							text: "Voltaje (V)"
						}
					}
				}
			}
		});
	}
	
	loadCSV();
	setInterval(loadCSV, 60000);
	</script>
</body>

</html>
